name: Generate GitHub Stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - "generated/**"
  schedule:
    # Update otomatis setiap hari jam 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Stats SVG
        uses: jstrieb/github-stats@v1
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
